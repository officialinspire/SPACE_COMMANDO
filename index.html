<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <title>SPACE COMMANDO – Side‑Scrolling Shooter</title>
  <!-- Link the stylesheet for basic page and HUD styling -->
  <link rel="stylesheet" href="styles.css">
  <!-- Import a retro sci‑fi font for the heads‑up display.  Orbitron provides
       a clean, futuristic look while Press Start 2P adds a pixel‑retro
       flavour.  These fonts are free to use via Google Fonts.  -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Press+Start+2P&family=Black+Ops+One&display=swap" rel="stylesheet">
</head>
<body>
  <!-- TAP TO START screen appears before everything else, outside game-container to avoid transform issues -->
  <div id="tap-to-start" class="tap-to-start-screen">
    <div class="tap-to-start-content">
      <h1 class="game-title">SPACE COMMANDO</h1>
      <div class="tap-prompt">TAP TO START</div>
    </div>
  </div>

  <!-- Game container holds both the intro video and the canvas.  The
       video overlays the canvas on first load and plays the credit
       sequence with audio.  Once complete it hides itself.  Using a
       container allows the intro to share the same dimensions as
       the game rather than occupying the full page. -->
  <div id="game-container">
    <video id="intro-video" class="intro-video" src="inspiresoftwareintro.mp4" playsinline muted></video>
    <!-- The game runs inside this canvas. It is scaled via CSS to fill the page while preserving the aspect ratio. -->
    <canvas id="game-canvas" width="800" height="450"></canvas>
  </div>

  <!--
    Mobile controls are arranged into rows to better mirror the provided
    mock‑up (see fixthismobile02.jpg).  The first row contains the
    shoot/reload pair on the left and the up arrow on the right.  The
    second row contains the jump button on the left and a horizontal
    cluster of left/down/right arrows on the right.  The final row
    contains the pause/menu, select and store buttons evenly spaced.
  -->
  <div id="mobile-controls">
    <!--
      Mobile control layout for touch devices.  The first row holds the
      shoot and reload buttons.  The second row places the jump button
      on the left and stacks the up arrow above a horizontal left/down/right
      pad on the right.  The bottom row contains the escape/menu,
      select and store buttons.  Using literal key names (e.g. "Space")
      ensures consistent behaviour when dispatching keyboard events.
    -->
    <!-- First row: Shoot/Reload -->
    <div class="row row1">
      <div class="dual-buttons">
        <button class="control-btn" data-key="z">SHOOT</button>
        <button class="control-btn" data-key="x">RELOAD</button>
      </div>
    </div>
    <!-- Second row: Jump and directional pad -->
    <div class="row row2">
      <button class="control-btn jump-btn" data-key="Space">JUMP</button>
      <div class="arrow-wrapper">
        <button class="control-btn arrow-btn" data-key="ArrowUp">↑</button>
        <div class="arrow-cluster">
          <button class="control-btn arrow-btn" data-key="ArrowLeft">←</button>
          <button class="control-btn arrow-btn" data-key="ArrowDown">↓</button>
          <button class="control-btn arrow-btn" data-key="ArrowRight">→</button>
        </div>
      </div>
    </div>
    <!-- Third row: Pause/Menu, Select, and Store -->
    <div class="row row3">
      <button class="control-btn menu-btn" data-key="Escape">ESC/MENU</button>
      <button class="control-btn" data-key="p">STORE</button>
      <button class="control-btn" data-key="Enter">SELECT</button>
    </div>
  </div>


  <!-- Main game logic -->
  <script src="index.js"></script>

  
  <script>
    // ---- Mobile full-screen & dynamic viewport height ----
    (function() {
      const isTouch = (('ontouchstart' in window) || navigator.maxTouchPoints > 0);
      // Use the Visual Viewport API when available to compute a stable 100vh that
      // ignores the collapsing URL bar on mobile browsers.
      function setVH() {
        const h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
        document.documentElement.style.setProperty('--vh', (h * 0.01) + 'px');
      }
      setVH();
      window.addEventListener('resize', setVH);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', setVH);
      }

      // Try to enter fullscreen and lock landscape on first user interaction.
      async function goFullscreen() {
        try {
          const el = document.getElementById('game-container');
          if (el && document.fullscreenElement == null) {
            if (el.requestFullscreen) await el.requestFullscreen();
          }
          if (screen.orientation && screen.orientation.lock) {
            try { await screen.orientation.lock('landscape'); } catch (e) {}
          }
        } catch (e) { /* ignore */ }
      }

      const firstInteract = () => {
        // Prevent bounce/scroll during gameplay
        document.body.style.overscrollBehavior = 'none';
        document.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });
        goFullscreen();
        // Remove these once-run listeners
        window.removeEventListener('click', firstInteract);
        window.removeEventListener('touchstart', firstInteract);
        window.removeEventListener('keydown', firstInteract);
      };
      if (isTouch) {
        window.addEventListener('click', firstInteract, { once: true });
        window.addEventListener('touchstart', firstInteract, { once: true });
        window.addEventListener('keydown', firstInteract, { once: true });
      }
    })();
  </script>

  <!-- TAP TO START and intro video handling -->
  <script>
    const tapToStart = document.getElementById('tap-to-start');
    const introVideo = document.getElementById('intro-video');

    if (tapToStart && introVideo) {
      // When the intro video finishes, hide it and start the menu music
      introVideo.addEventListener('ended', () => {
        try { introVideo.pause(); introVideo.currentTime = 0; } catch (e) {}
        introVideo.style.display = 'none';

        // Start menu music after intro video ends (accessed from index.js global scope)
        setTimeout(() => {
          if (window.menuMusic && window.fadeIn) {
            window.fadeIn(window.menuMusic);
          }
        }, 100);
      });

      // Handle TAP TO START screen
      let gameStarted = false;
      const startGame = (e) => {
        // Prevent double-triggering from both touch and click events
        if (gameStarted) return;
        gameStarted = true;

        // Prevent default to avoid any interference
        if (e && e.preventDefault) {
          e.preventDefault();
        }

        // Hide TAP TO START screen
        tapToStart.style.display = 'none';

        // Start the intro video (starts muted, then unmute after playback begins)
        if (introVideo.paused) {
          introVideo.play()
            .then(() => {
              // Successfully started playing, now unmute
              introVideo.muted = false;
            })
            .catch((err) => {
              // If video fails to play, hide it and start menu music directly
              introVideo.style.display = 'none';
              setTimeout(() => {
                if (window.menuMusic && window.fadeIn) {
                  window.fadeIn(window.menuMusic);
                }
              }, 100);
            });
        }
      };

      // Use pointerup as the canonical tap/click handler to avoid
      // double-firing on touch devices that synthesize click events.
      let lastPointerType = null;
      tapToStart.addEventListener('pointerdown', (e) => {
        lastPointerType = e.pointerType;
      }, { passive: true });

      tapToStart.addEventListener('pointerup', (e) => {
        if (gameStarted) return;
        e.preventDefault();
        startGame(e);
      }, { passive: false });

      // Desktop fallback for older browsers with no Pointer Events.
      tapToStart.addEventListener('click', (e) => {
        if (gameStarted) return;
        if (lastPointerType === 'touch' || lastPointerType === 'pen') return;
        startGame(e);
      });

      // Handle keyboard
      document.addEventListener('keydown', (e) => {
        if (!gameStarted) {
          startGame(e);
        }
      }, { once: true });
    }
  </script>
</body>
</html>
