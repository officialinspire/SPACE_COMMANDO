<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPACE COMMANDO – Side‑Scrolling Shooter</title>
  <!-- Link the stylesheet for basic page and HUD styling -->
  <link rel="stylesheet" href="styles.css">
  <!-- Import a retro sci‑fi font for the heads‑up display.  Orbitron provides
       a clean, futuristic look while Press Start 2P adds a pixel‑retro
       flavour.  These fonts are free to use via Google Fonts.  -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Game container holds both the intro video and the canvas.  The
       video overlays the canvas on first load and plays the credit
       sequence with audio.  Once complete it hides itself.  Using a
       container allows the intro to share the same dimensions as
       the game rather than occupying the full page. -->
  <div id="game-container">
    <video id="intro-video" class="intro-video" src="inspiresoftwareintro.mp4" playsinline></video>
    <!-- The game runs inside this canvas. It is scaled via CSS to fill the page while preserving the aspect ratio. -->
    <canvas id="game-canvas" width="800" height="450"></canvas>
  </div>

  <!-- Rotation prompt: shown on mobile devices in portrait mode -->
  <div id="rotation-prompt" class="rotation-prompt">
    <div class="rotation-content">
      <div class="phone-icon">📱 ↻</div>
      <h2>PLEASE ROTATE YOUR DEVICE</h2>
      <p>Turn your phone horizontally to play</p>
    </div>
  </div>

  <!-- Mobile controls: retro NES/Gameboy Color style overlay
       Layout mimics classic handheld gaming:
       - D-pad on the left for movement
       - Action buttons (FIRE/RELOAD) on the right like NES A/B buttons
       - Menu buttons (SHOP/SELECT/ESC) centered at top of controls
  -->
  <div id="mobile-controls" class="mobile-controls">
    <!-- D-Pad (Left side) -->
    <div class="dpad-container">
      <div class="dpad">
        <button data-key="ArrowUp" class="dpad-btn dpad-up">▲</button>
        <button data-key="ArrowLeft" class="dpad-btn dpad-left">◀</button>
        <button data-key="ArrowDown" class="dpad-btn dpad-down">▼</button>
        <button data-key="ArrowRight" class="dpad-btn dpad-right">▶</button>
        <div class="dpad-center"></div>
      </div>
    </div>

    <!-- Menu buttons (Center) -->
    <div class="menu-buttons">
      <button data-key="p" class="menu-btn">SHOP</button>
      <button data-key="Enter" class="menu-btn">SELECT</button>
      <button data-key="Escape" class="menu-btn">MENU</button>
    </div>

    <!-- Jump button (Center bottom) -->
    <div class="jump-button">
      <button data-key=" " class="jump-btn">JUMP</button>
    </div>

    <!-- Action buttons (Right side) -->
    <div class="action-buttons">
      <button data-key="z" class="action-btn fire-btn">FIRE</button>
      <button data-key="x" class="action-btn reload-btn">RELOAD</button>
    </div>
  </div>

  <!-- Main game logic -->
  <script src="index.js"></script>

  <!-- Hide the intro once it finishes playing.  Listening on the
       ended event ensures that the game only becomes visible when
       the credit video is complete. -->
  <script>
    const introVideo = document.getElementById('intro-video');
    if (introVideo) {
      // When the credit finishes, hide the video so the game is visible
      introVideo.addEventListener('ended', () => {
        introVideo.style.display = 'none';
      });
      // Trigger playback with audio on the first user interaction (click or key press)
      const startIntro = () => {
        if (introVideo.paused) {
          try {
            introVideo.muted = false;
            introVideo.play();
          } catch (err) {
            /* swallow autoplay errors */
          }
        }
      };
      document.addEventListener('click', startIntro, { once: true });
      document.addEventListener('keydown', startIntro, { once: true });
    }
  </script>
</body>
</html>
