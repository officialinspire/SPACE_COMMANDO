<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Mobile web app meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#030712">

  <title>SPACE COMMANDO – Side-Scrolling Shooter</title>
  <!-- Core styles for layout and the retro mobile controls -->
  <link rel="stylesheet" href="styles.css">
  <!-- Retro display fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Orientation prompt for mobile devices in portrait mode -->
  <div id="orientation-prompt" class="orientation-prompt">
    <div class="orientation-content">
      <div class="rotate-icon">📱 ↻</div>
      <h2>Please Rotate Your Device</h2>
      <p>This game is best played in landscape mode</p>
    </div>
  </div>

  <!-- Game container holds both the intro video and the canvas.  The
       video overlays the canvas on first load and plays the credit
       sequence with audio.  Once complete it hides itself.  Using a
       container allows the intro to share the same dimensions as
       the game rather than occupying the full page. -->
  <!-- Landscape orientation prompt for mobile devices -->
  <div id="rotate-prompt" class="rotate-prompt">
    <div class="rotate-content">
      <div class="rotate-icon">📱 ↻</div>
      <h2>Please Rotate Your Device</h2>
      <p>For the best gaming experience, please rotate your device to landscape orientation.</p>
    </div>
  </div>

  <div id="game-container">
    <video id="intro-video" class="intro-video" src="inspiresoftwareintro.mp4" playsinline></video>
    <canvas id="game-canvas"></canvas>
  </div>

  <!--
    RETRO MOBILE CONTROLS

    NES/Gameboy Color inspired touch controls for mobile gameplay.
    Layout mimics classic handheld consoles:
    - D-Pad on the left side
    - Action buttons (A/B style) on the right side
    - Menu buttons along the top

    Each button has a data-key attribute that maps to keyboard controls.
    The container is hidden on desktop and only shown on mobile via JavaScript.
  -->
  <div id="mobile-controls" class="mobile-controls">
    <!-- Top menu bar with system buttons -->
    <div class="menu-bar">
      <button data-key="p" class="control-btn menu-top-btn">
        <span class="btn-label">SHOP</span>
      </button>
      <button data-key="Enter" class="control-btn menu-top-btn">
        <span class="btn-label">SELECT</span>
      </button>
      <button data-key="Escape" class="control-btn menu-top-btn">
        <span class="btn-label">MENU</span>
      </button>
    </div>

    <!-- Main control area -->
    <div class="controls-main">
      <!-- D-Pad (Left Side) -->
      <div class="dpad-container">
        <div class="dpad">
          <button data-key="ArrowUp" class="control-btn dpad-btn dpad-up">
            <span class="arrow">▲</span>
          </button>
          <div class="dpad-middle">
            <button data-key="ArrowLeft" class="control-btn dpad-btn dpad-left">
              <span class="arrow">◀</span>
            </button>
            <div class="dpad-center"></div>
            <button data-key="ArrowRight" class="control-btn dpad-btn dpad-right">
              <span class="arrow">▶</span>
            </button>
          </div>
          <button data-key="ArrowDown" class="control-btn dpad-btn dpad-down">
            <span class="arrow">▼</span>
          </button>
        </div>
      </div>

      <!-- Action Buttons (Right Side) -->
      <div class="action-buttons">
        <div class="action-row action-top">
          <button data-key="x" class="control-btn action-btn">
            <span class="btn-label">RELOAD</span>
            <span class="btn-key">X</span>
          </button>
        </div>
        <div class="action-row action-bottom">
          <button data-key=" " class="control-btn action-btn jump-btn">
            <span class="btn-label">JUMP</span>
            <span class="btn-key">A</span>
          </button>
          <button data-key="z" class="control-btn action-btn fire-btn">
            <span class="btn-label">FIRE</span>
            <span class="btn-key">B</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main game logic -->
  <script src="index.js"></script>

  <!-- Hide the intro once it finishes playing. -->
  <script>
    const introVideo = document.getElementById('intro-video');
    if (introVideo) {
      introVideo.addEventListener('ended', () => {
        introVideo.style.display = 'none';
      });
      const startIntro = () => {
        if (introVideo.paused) {
          try {
            introVideo.muted = false;
            introVideo.play();
          } catch (err) {
            /* swallow autoplay errors */
          }
        }
      };
      document.addEventListener('click', startIntro, { once: true });
      document.addEventListener('keydown', startIntro, { once: true });
    }
  </script>
</body>
</html>
