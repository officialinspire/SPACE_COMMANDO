<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SPACE COMMANDO – Side-Scrolling Shooter</title>
  <!-- Core styles for layout and the retro mobile controls -->
  <link rel="stylesheet" href="styles.css">
  <!-- Retro display fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Game container holds both the intro video and the canvas. -->
  <div id="game-container">
    <video id="intro-video" class="intro-video" src="inspiresoftwareintro.mp4" playsinline></video>
    <canvas id="game-canvas" width="800" height="450"></canvas>
  </div>

  <!-- Orientation message shown on mobile when the device is in portrait. -->
  <div id="orientation-lock" class="orientation-lock" role="alert" aria-live="assertive" aria-hidden="true">
    <div class="orientation-lock__content">
      <h2>Rotate Your Device</h2>
      <p>Turn your phone to landscape mode to access the Space Commando controls.</p>
    </div>
  </div>

  <!-- Gold retro themed mobile controls. Hidden on desktop and portrait. -->
  <div id="mobile-controls" class="mobile-controls" aria-hidden="true">
    <div class="control-panel control-panel--dpad">
      <div class="dpad">
        <button class="control-btn control-btn--dpad" data-keys="ArrowUp" aria-label="Up">
          <span class="control-icon">▲</span>
          <span class="control-label">UP</span>
        </button>
        <div class="dpad-horizontal">
          <button class="control-btn control-btn--dpad" data-keys="ArrowLeft" aria-label="Left">
            <span class="control-icon">◀</span>
            <span class="control-label">LEFT</span>
          </button>
          <button class="control-btn control-btn--dpad" data-keys="ArrowDown" aria-label="Down">
            <span class="control-icon">▼</span>
            <span class="control-label">DOWN</span>
          </button>
          <button class="control-btn control-btn--dpad" data-keys="ArrowRight" aria-label="Right">
            <span class="control-icon">▶</span>
            <span class="control-label">RIGHT</span>
          </button>
        </div>
      </div>
    </div>
    <div class="control-panel control-panel--actions">
      <div class="action-grid">
        <button class="control-btn" data-keys="p" aria-label="Shop">SHOP</button>
        <button class="control-btn" data-keys="Escape" aria-label="Menu">MENU</button>
        <button class="control-btn" data-keys="Escape" aria-label="Esc">ESC</button>
        <button class="control-btn" data-keys="Enter|Space" aria-label="Select">SELECT</button>
        <button class="control-btn control-btn--primary" data-keys="z" aria-label="Fire">FIRE</button>
        <button class="control-btn" data-keys="x" aria-label="Reload">RELOAD</button>
      </div>
    </div>
  </div>

  <!-- Main game logic -->
  <script src="index.js"></script>

  <!-- Hide the intro once it finishes playing. -->
  <script>
    const introVideo = document.getElementById('intro-video');
    if (introVideo) {
      introVideo.addEventListener('ended', () => {
        introVideo.style.display = 'none';
      });
      const startIntro = () => {
        if (introVideo.paused) {
          try {
            introVideo.muted = false;
            introVideo.play();
          } catch (err) {
            /* swallow autoplay errors */
          }
        }
      };
      document.addEventListener('click', startIntro, { once: true });
      document.addEventListener('keydown', startIntro, { once: true });
    }
  </script>
</body>
</html>
