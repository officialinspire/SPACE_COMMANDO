<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1019">
  <title>SPACE COMMANDO | Orbital Station Shooter</title>
  <meta name="description" content="Fight through a breached orbital station in SPACE COMMANDO, a military sci-fi side-scroller from INSPIRE.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="SPACE COMMANDO | Orbital Station Shooter">
  <meta property="og:description" content="Fight through a breached orbital station in this military sci-fi side-scroller from INSPIRE.">
  <meta property="og:url" content="https://officialinspire.github.io/SPACE_COMMANDO/">
  <meta property="og:image" content="https://officialinspire.github.io/SPACE_COMMANDO/assets/ui/orbital-breach-social.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="675">
  <meta property="og:image:alt" content="An armored commando looks out through a breached orbital hangar.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SPACE COMMANDO | Orbital Station Shooter">
  <meta name="twitter:description" content="Fight through a breached orbital station in this military sci-fi side-scroller from INSPIRE.">
  <meta name="twitter:image" content="https://officialinspire.github.io/SPACE_COMMANDO/assets/ui/orbital-breach-social.jpg">
  <meta name="twitter:image:alt" content="An armored commando looks out through a breached orbital hangar.">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-boot="start">
  <main class="game-shell">
    <div class="game-stage">
      <div id="game-container">
        <canvas id="game-canvas" width="800" height="450" aria-label="SPACE COMMANDO playfield"></canvas>
      </div>
      <div id="game-menu" class="menu-layer" hidden></div>
      <div id="intro-layer" class="intro-layer" hidden>
        <video id="intro-video" src="inspiresoftwareintro.mp4" playsinline muted preload="metadata"></video>
        <button id="skip-intro" class="system-button" type="button">Skip intro</button>
      </div>
    </div>

    <div id="mobile-controls" class="touch-controls" role="group" aria-label="Game controls" hidden>
      <div class="direction-pad" role="group" aria-label="Movement and aim">
        <button class="control-btn" type="button" data-key="ArrowUp" aria-label="Up, aim or climb">↑</button>
        <button class="control-btn" type="button" data-key="ArrowLeft" aria-label="Move left">←</button>
        <button class="control-btn" type="button" data-key="ArrowDown" aria-label="Down, crouch or climb">↓</button>
        <button class="control-btn" type="button" data-key="ArrowRight" aria-label="Move right">→</button>
      </div>
      <div class="utility-pad" role="group" aria-label="Menu controls">
        <button class="control-btn" type="button" data-key="Escape">Menu</button>
        <button class="control-btn" type="button" data-key="Enter">Select</button>
        <button class="control-btn" type="button" data-key="p">Shop</button>
      </div>
      <div class="action-pad" role="group" aria-label="Action controls">
        <button class="control-btn" type="button" data-key="Space">Jump</button>
        <button class="control-btn" type="button" data-key="z">Fire</button>
        <button class="control-btn" type="button" data-key="x">Reload</button>
      </div>
    </div>
  </main>

  <div id="tap-to-start" class="start-screen title-art">
    <section class="launch-panel" aria-labelledby="launch-title">
      <h1 id="launch-title">SPACE<br>COMMANDO</h1>
      <button id="launch-game" class="system-button primary-button" type="button">Tap to start</button>
    </section>
  </div>

  <script src="combat-audio.js"></script>
  <script src="station-layout.js"></script>
  <script src="index.js"></script>
  <script>
    (() => {
      const splash = document.getElementById('tap-to-start');
      const launcher = document.getElementById('launch-game');
      const intro = document.getElementById('intro-layer');
      const video = document.getElementById('intro-video');
      const skip = document.getElementById('skip-intro');
      let stallTimer;

      function toggleFullscreen() {
        const request = document.fullscreenElement
          ? document.exitFullscreen?.()
          : document.documentElement.requestFullscreen?.();
        request?.catch(() => {});
      }

      function finishIntro() {
        if (document.body.dataset.boot !== 'intro') return;
        clearTimeout(stallTimer);
        intro.hidden = true;
        video.pause();
        document.body.dataset.boot = 'ready';
        const playMenuMusic = () => window.fadeIn?.(window.menuMusic);
        if (window.menuMusic) playMenuMusic();
        else window.addEventListener('load', playMenuMusic, { once: true });
        document.dispatchEvent(new Event('commando-ready'));
      }

      function waitForVideo() {
        if (document.body.dataset.boot !== 'intro') return;
        clearTimeout(stallTimer);
        stallTimer = setTimeout(finishIntro, 6500);
      }

      function begin() {
        if (document.body.dataset.boot !== 'start') return;
        document.body.dataset.boot = 'intro';
        splash.hidden = true;
        intro.hidden = false;
        if (!document.fullscreenElement) toggleFullscreen();
        skip.focus({ preventScroll: true });
        if (video.error) {
          finishIntro();
          return;
        }
        waitForVideo();
        video.play().then(() => { video.muted = false; }).catch(finishIntro);
      }

      splash.addEventListener('click', begin);
      skip.addEventListener('click', finishIntro);
      video.addEventListener('ended', finishIntro);
      video.addEventListener('error', finishIntro);
      video.addEventListener('playing', () => clearTimeout(stallTimer));
      video.addEventListener('waiting', waitForVideo);
      document.getElementById('game-container').addEventListener('dblclick', toggleFullscreen);
      document.addEventListener('keydown', event => {
        const boot = document.body.dataset.boot;
        if (boot === 'start' && (event.key === 'Enter' || event.key === ' ') && event.target !== launcher) {
          event.preventDefault();
          begin();
        } else if (boot === 'intro' && event.key === 'Escape') {
          event.preventDefault();
          finishIntro();
        } else if (boot === 'ready' && event.key.toLowerCase() === 'f' && !event.repeat) {
          toggleFullscreen();
        }
      });
    })();
  </script>
</body>
</html>
